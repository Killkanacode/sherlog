limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location / {
        try_files $uri /index.html;
    }
    # Assets are content-hashed; the page itself must never be stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Sherlog's API checks keys and sessions itself.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://sherlog-api:8200/auth/login;
    }
    location = /api/stream {
        proxy_pass http://sherlog-api:8200/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/ {
        proxy_pass http://sherlog-api:8200/;
        proxy_read_timeout 300s;
    }

    # Everything else the console reaches is checked against Sherlog's access
    # rules first: reads need a viewer, writes an operator.
    location = /_auth {
        internal;
        proxy_pass http://sherlog-api:8200/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
    }

    # The Chaos Lab drives the chaos controller. Only this console reaches it;
    # Sherlog itself has no route there.
    location /chaos/ {
        auth_request /_auth;
        proxy_pass http://chaos-controller:8100/;
        proxy_read_timeout 120s;
    }

    # Read-only views the console needs: RED charts and deployed versions.
    location = /prom/api/v1/query_range {
        auth_request /_auth;
        limit_except GET { deny all; }
        proxy_pass http://prometheus:9090/api/v1/query_range;
    }
    location = /platform/services {
        auth_request /_auth;
        limit_except GET { deny all; }
        proxy_pass http://platform-api:8050/services;
    }
    location = /platform/flags {
        auth_request /_auth;
        limit_except GET { deny all; }
        proxy_pass http://platform-api:8050/flags;
    }
}
