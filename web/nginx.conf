server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }
    # Assets are content-hashed; the page itself must never be stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Sherlog's API, and its live event stream (no buffering).
    location = /api/stream {
        proxy_pass http://sherlog-api:8200/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/ {
        proxy_pass http://sherlog-api:8200/;
        proxy_read_timeout 300s;
    }

    # The Chaos Lab drives the chaos controller. Only this console reaches it;
    # Sherlog itself has no route there.
    location /chaos/ {
        proxy_pass http://chaos-controller:8100/;
        proxy_read_timeout 120s;
    }

    # Read-only views the console needs: RED charts and deployed versions.
    location = /prom/api/v1/query_range {
        limit_except GET { deny all; }
        proxy_pass http://prometheus:9090/api/v1/query_range;
    }
    location = /platform/services {
        limit_except GET { deny all; }
        proxy_pass http://platform-api:8050/services;
    }
    location = /platform/flags {
        limit_except GET { deny all; }
        proxy_pass http://platform-api:8050/flags;
    }
}
