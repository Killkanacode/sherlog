name: sherlog

# Networks:
#   app       — the shop (system under test) and its data stores
#   obs       — observability backends (Sherlog reads from here)
#   platform  — the deploy platform API, shared with Sherlog
#   chaos     — fault injection; Sherlog is never attached to it
#   sherlog   — Sherlog and its own database
networks:
  app:
  obs:
  platform:
  chaos:
  sherlog:

# Config files are mounted as directories (not single files) so edits on the
# host are picked up on restart.

volumes:
  pgdata:
  prometheus-data:
  loki-data:
  tempo-data:
  platform-data:
  chaos-data:
  sherlog-db:

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  OTEL_BSP_SCHEDULE_DELAY: "1000"
  OTEL_BLRP_SCHEDULE_DELAY: "1000"
  DEPLOY_ENV: demo

x-demo-service: &demo-service
  restart: unless-stopped
  mem_limit: 256m
  networks: [app]

services:
  # ---------------------------------------------------------------- demo app
  gateway:
    <<: *demo-service
    image: sherlog-demo/gateway:main
    build:
      context: ./demo-app
      args: {SERVICE: gateway, VERSION: main}
    environment:
      <<: *otel-env
      PORT: "8000"
      INVENTORY_URL: http://inventory:8003
      ORDERS_URL: http://orders:8001
    ports: ["127.0.0.1:${GATEWAY_HOST_PORT:-8000}:8000"]
    depends_on:
      orders: {condition: service_healthy}
      inventory: {condition: service_healthy}

  orders:
    <<: *demo-service
    image: sherlog-demo/orders:main
    build:
      context: ./demo-app
      args: {SERVICE: orders, VERSION: main}
    environment:
      <<: *otel-env
      PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://shop:${POSTGRES_PASSWORD:-shop}@postgres:5432/shop
      DB_POOL_SIZE: "10"
      INVENTORY_URL: http://toxiproxy:18003
      PAYMENTS_URL: http://toxiproxy:18002
      INVENTORY_TIMEOUT_S: "2.0"
      PAYMENTS_TIMEOUT_S: "2.0"
      RETRIES: "2"
      RETRY_BACKOFF_MS: "100"
      FLAGS_URL: http://platform-api:8050/flags
    depends_on:
      postgres: {condition: service_healthy}
      toxiproxy: {condition: service_started}
      inventory: {condition: service_healthy}

  payments:
    <<: *demo-service
    image: sherlog-demo/payments:main
    build:
      context: ./demo-app
      args: {SERVICE: payments, VERSION: main}
    environment:
      <<: *otel-env
      PORT: "8002"
      REDIS_URL: redis://redis:6379/0
      PROVIDER_LATENCY_MS_MIN: "200"
      PROVIDER_LATENCY_MS_MAX: "500"
      PROVIDER_MAX_CONCURRENCY: "16"
      PROVIDER_PENDING_RATE: "0.1"
    depends_on:
      redis: {condition: service_healthy}

  inventory:
    <<: *demo-service
    image: sherlog-demo/inventory:main
    build:
      context: ./demo-app
      args: {SERVICE: inventory, VERSION: main}
    environment:
      <<: *otel-env
      PORT: "8003"
      DATABASE_URL: postgresql+asyncpg://shop:${POSTGRES_PASSWORD:-shop}@postgres:5432/shop
      DB_POOL_SIZE: "10"
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_S: "30"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    networks: [app]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    command: ["postgres", "-c", "max_connections=200"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    mem_limit: 128m
    networks: [app]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sits on the orders -> inventory and orders -> payments links so network
  # faults can be injected between services.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    restart: unless-stopped
    mem_limit: 64m
    networks: [app, chaos]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes: ["./chaos:/config:ro"]

  loadgen:
    image: locustio/locust:2.47.0
    restart: unless-stopped
    mem_limit: 256m
    networks: [app]
    command:
      - -f
      - /mnt/locust/locustfile.py
      - --headless
      - --only-summary
      - --users
      - "${LOCUST_USERS:-30}"
      - --spawn-rate
      - "3"
      - --host
      - http://gateway:8000
    volumes: ["./demo-app/loadgen:/mnt/locust:ro"]
    depends_on:
      gateway: {condition: service_healthy}

  # ------------------------------------------------------------------ sherlog
  # The agent. It sees only what an SRE would: telemetry (obs), the deploy
  # platform (platform) and its own database. No Docker socket, no route to
  # the shop's internals or to the chaos controller.
  sherlog-api:
    build: ./agent
    image: sherlog/agent:dev
    restart: unless-stopped
    mem_limit: 512m
    networks: [obs, platform, sherlog]
    environment:
      SHERLOG_DATABASE_URL: postgresql+asyncpg://sherlog:${SHERLOG_DB_PASSWORD:-sherlog}@sherlog-db:5432/sherlog
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      PLATFORM_API_URL: http://platform-api:8050
      SHERLOG_LEARNING_S: ${SHERLOG_LEARNING_S:-600}
      # Models (TODO(VERIFY) against Meta's docs)
      SHERLOG_FAKE_LLM: ${SHERLOG_FAKE_LLM:-false}
      META_API_BASE_URL: ${META_API_BASE_URL:-}
      META_API_KEY: ${META_API_KEY:-}
      MODEL_INVESTIGATOR: ${MODEL_INVESTIGATOR:-}
      MODEL_INVESTIGATOR_PRICE_IN: ${MODEL_INVESTIGATOR_PRICE_IN:-}
      MODEL_INVESTIGATOR_PRICE_OUT: ${MODEL_INVESTIGATOR_PRICE_OUT:-}
      OPEN_MODEL_BASE_URL: ${OPEN_MODEL_BASE_URL:-}
      OPEN_MODEL_API_KEY: ${OPEN_MODEL_API_KEY:-}
      OPEN_MODEL_ID: ${OPEN_MODEL_ID:-}
      OPEN_MODEL_PRICE_IN: ${OPEN_MODEL_PRICE_IN:-}
      OPEN_MODEL_PRICE_OUT: ${OPEN_MODEL_PRICE_OUT:-}
      # Investigation limits
      SHERLOG_INVESTIGATE: ${SHERLOG_INVESTIGATE:-true}
      SHERLOG_MAX_STEPS: ${SHERLOG_MAX_STEPS:-12}
      SHERLOG_TOKEN_BUDGET_PER_INCIDENT: ${SHERLOG_TOKEN_BUDGET_PER_INCIDENT:-60000}
      SHERLOG_TOOL_TIMEOUT_S: ${SHERLOG_TOOL_TIMEOUT_S:-20}
      # Actions (autonomy and dry run are defaults; PUT /settings overrides them)
      SHERLOG_AUTONOMY: ${SHERLOG_AUTONOMY:-L1}
      SHERLOG_DRY_RUN: ${SHERLOG_DRY_RUN:-false}
      SHERLOG_AUTO_MIN_CONFIDENCE: ${SHERLOG_AUTO_MIN_CONFIDENCE:-0.7}
      SHERLOG_MAX_ACTION_CYCLES: ${SHERLOG_MAX_ACTION_CYCLES:-2}
      SHERLOG_VERIFY_TIMEOUT_S: ${SHERLOG_VERIFY_TIMEOUT_S:-180}
      SHERLOG_VERIFY_HEALTHY_S: ${SHERLOG_VERIFY_HEALTHY_S:-30}
    ports: ["127.0.0.1:8200:8200"]
    depends_on:
      sherlog-db: {condition: service_healthy}

  sherlog-db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    networks: [sherlog]
    environment:
      POSTGRES_DB: sherlog
      POSTGRES_USER: sherlog
      POSTGRES_PASSWORD: ${SHERLOG_DB_PASSWORD:-sherlog}
    volumes: [sherlog-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlog -d sherlog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The console. It also drives the Chaos Lab, so it joins the chaos network;
  # the agent above still has no route there.
  web:
    build: ./web
    image: sherlog/web:dev
    restart: unless-stopped
    mem_limit: 64m
    networks: [sherlog, obs, platform, chaos]
    ports: ["127.0.0.1:${WEB_HOST_PORT:-8300}:80"]
    depends_on: [sherlog-api, chaos-controller, prometheus, platform-api]

  # ------------------------------------------------------- platform & chaos
  # Simulated CD platform. Adopts the compose-run demo containers and replaces
  # them on deploy / rollback / config changes. Reads git history (read-only)
  # to build images from commits.
  platform-api:
    build: ./platform-api
    image: sherlog/platform-api:dev
    restart: unless-stopped
    mem_limit: 256m
    networks: [app, platform, chaos]
    environment:
      COMPOSE_PROJECT: sherlog
      SHERLOG_EVENTS_URL: ${SHERLOG_EVENTS_URL:-http://sherlog-api:8200/events}
    ports: ["127.0.0.1:8050:8050"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.git:/repo.git:ro
      - platform-data:/data
    depends_on:
      gateway: {condition: service_healthy}
      payments: {condition: service_healthy}

  # Injects faults and keeps the ground truth. Only the chaos network (with
  # platform-api and toxiproxy) reaches it; Sherlog never does.
  chaos-controller:
    build: ./chaos
    image: sherlog/chaos-controller:dev
    restart: unless-stopped
    mem_limit: 256m
    networks: [chaos]
    environment:
      COMPOSE_PROJECT: sherlog
      PLATFORM_API_URL: http://platform-api:8050
      TOXIPROXY_URL: http://toxiproxy:8474
    ports: ["127.0.0.1:8100:8100"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./benchmark/scenarios:/scenarios:ro
      - chaos-data:/data
    depends_on: [platform-api, toxiproxy]

  # ----------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    mem_limit: 512m
    networks: [app, obs]
    command: ["--config=/etc/observability/otel-collector.yaml"]
    volumes: ["./observability:/etc/observability:ro"]
    depends_on: [loki, tempo]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    mem_limit: 768m
    networks: [obs]
    command:
      - --config.file=/etc/observability/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability:/etc/observability:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    mem_limit: 768m
    networks: [obs]
    command: ["-config.file=/etc/observability/loki.yaml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./observability:/etc/observability:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    mem_limit: 1g
    networks: [obs]
    command: ["-config.file=/etc/observability/tempo.yaml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes:
      - ./observability:/etc/observability:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:13.2.5
    profiles: [debug]
    restart: unless-stopped
    mem_limit: 256m
    networks: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./observability/grafana:/etc/grafana/provisioning/datasources:ro"]
